[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldforge"
version = "0.1.0"
description = "Biot-Savart magnetic field simulator"
readme = "README.md"
authors = [
    { name = "Filipe Brega", email = "filipebregaco@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "matplotlib"
]
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
